<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator | Exp 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
/* ============ Reset & tokens ============ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box; /* Box Model */
}

:root {
  --body-dark: #23262f;
  --body-darker: #1a1c23;
  --screen-bg: #b9d6b0;
  --screen-ink: #1d2b1a;
  --key-num: #f4f2ea;
  --key-num-ink: #23262f;
  --key-fn: #3a3f4d;
  --key-fn-ink: #d8dae2;
  --key-op: #ff9f43;
  --key-op-ink: #26160a;
  --key-equals: #34c38f;
  --accent: #34c38f;

  --font-display: "Space Grotesk", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at 30% 0%, #33384a 0%, #1a1c23 60%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 34px 16px 40px;
  font-family: var(--font-display);
  color: #e8e9ee;
}

.page-title {
  font-size: 1.4rem;
  letter-spacing: 0.02em;
  margin-bottom: 22px;
  color: #f1f2f6;
}

/* ============ Calculator shell ============ */
.calc {
  width: 340px;
  max-width: 92vw;
  background: linear-gradient(160deg, var(--body-dark), var(--body-darker));
  border-radius: 22px;
  padding: 20px;
  box-shadow:
    0 30px 60px -20px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  border: 1px solid #33384a; /* Box Model: border */
}

/* ============ Utility row (theme + icons) ============ */
.util-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.theme-swatches {
  display: flex;
  gap: 8px;
}

.swatch {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}

.swatch-green { background: #7ec98f; }
.swatch-amber { background: #e8b04b; }
.swatch-blue  { background: #6fb3e0; }

.swatch:hover {
  transform: scale(1.15);
}

.swatch.active {
  border-color: #fff;
}

.util-icons {
  display: flex;
  gap: 6px;
}

.icon-btn {
  background: transparent;
  border: 1px solid #454b5c; /* Box Model: border */
  color: #9aa0b4;
  border-radius: 8px;
  width: 30px;
  height: 26px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: border-color 0.15s;
}

.icon-btn:hover {
  border-color: var(--accent);
}

.icon-btn.muted {
  opacity: 0.4;
}

/* ============ Screen ============ */
.screen {
  background: var(--screen-bg);
  border-radius: 10px;
  padding: 16px 16px 12px; /* Box Model: padding */
  margin-bottom: 16px;
  border: 3px solid #8fae86; /* Box Model: border, bezel effect */
  box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.25);
  text-align: right;
  overflow: hidden;
}

.screen-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  color: var(--screen-ink);
  opacity: 0.7;
  font-size: 0.72rem;
  min-height: 16px;
  margin-bottom: 6px;
}

#modeTag {
  font-weight: 700;
  letter-spacing: 0.06em;
}

#expression {
  flex: 1;
  text-align: right;
  margin-left: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.result-row {
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  gap: 8px;
}

.result {
  font-family: var(--font-mono);
  font-size: 2.1rem;
  font-weight: 700;
  color: var(--screen-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.copy-btn {
  background: transparent;
  border: none;
  color: var(--screen-ink);
  opacity: 0.55;
  font-size: 1rem;
  cursor: pointer;
  padding-bottom: 6px; /* Box Model: padding, aligns with result baseline */
  transition: opacity 0.15s;
}

.copy-btn:hover {
  opacity: 1;
}

.copied-flash {
  display: block;
  text-align: right;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  color: var(--screen-ink);
  opacity: 0;
  transition: opacity 0.3s;
  height: 12px;
}

.copied-flash.show {
  opacity: 0.75;
}

/* ============ History drawer ============ */
.history-drawer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, margin 0.3s ease;
  margin-bottom: 0;
  background: #1e212a;
  border-radius: 10px;
  border: 1px solid #33384a; /* Box Model: border */
}

.history-drawer.open {
  max-height: 180px;
  margin-bottom: 16px;
}

.history-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px; /* Box Model: padding */
  font-size: 0.72rem;
  color: #9aa0b4;
  border-bottom: 1px solid #33384a; /* Box Model: border */
}

.history-head button {
  background: transparent;
  border: none;
  color: var(--accent);
  font-size: 0.7rem;
  cursor: pointer;
}

.history-list {
  list-style: none;
  max-height: 136px;
  overflow-y: auto;
  padding: 4px 0;
}

.history-list li {
  padding: 7px 12px; /* Box Model: padding */
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: #c7c9d6;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.history-list li:hover {
  background: #262a35;
}

.history-list li .h-expr {
  color: #7d8298;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-empty {
  color: #565c70 !important;
  cursor: default !important;
  justify-content: center !important;
}

/* ============ LCD color themes ============ */
.calc.theme-amber {
  --screen-bg: #e8c98a;
  --screen-ink: #3a2a0a;
  --accent: #c98a2e;
  --key-equals: #c98a2e;
}

.calc.theme-blue {
  --screen-bg: #a9cbe8;
  --screen-ink: #0d2438;
  --accent: #3f8ec9;
  --key-equals: #3f8ec9;
}

/* ============ Mode row ============ */
.mode-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.key-mode {
  background: transparent;
  border: 1px solid #454b5c; /* Box Model: border */
  color: #9aa0b4;
  border-radius: 8px;
  padding: 7px 4px;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.15s;
}

.key-mode:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.key-mode.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #0d1f17;
}

/* ============ Button grid ============ */
.keys {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.key {
  border: none;
  border-radius: 9px;
  padding: 13px 4px; /* Box Model: padding */
  font-family: var(--font-display);
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.08s, filter 0.15s;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
}

.key:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
}

.key-num {
  background: var(--key-num);
  color: var(--key-num-ink);
}

.key-fn {
  background: var(--key-fn);
  color: var(--key-fn-ink);
  font-size: 0.8rem;
}

.key-op {
  background: var(--key-op);
  color: var(--key-op-ink);
  font-size: 1.05rem;
}

.key-equals {
  background: var(--key-equals);
  color: #0d1f17;
  grid-column: span 3;
  font-size: 1.1rem;
}

.key:hover {
  filter: brightness(1.08);
}

/* ============ Hint ============ */
.hint {
  margin-top: 16px;
  font-size: 0.76rem;
  color: #6d7386;
  text-align: center;
  max-width: 320px;
}

/* ============ Media Queries ============ */
@media (max-width: 400px) {
  .calc {
    width: 100%;
    padding: 16px;
  }

  .result {
    font-size: 1.7rem;
  }

  .key {
    padding: 12px 2px;
    font-size: 0.82rem;
  }
}

</style>
</head>
<body>

  <h1 class="page-title">Scientific Calculator</h1>

  <div class="calc" id="calcBody">

    <!-- ============ Top utility bar ============ -->
    <div class="util-row">
      <div class="theme-swatches">
        <button class="swatch swatch-green active" data-theme="green" aria-label="Green LCD"></button>
        <button class="swatch swatch-amber" data-theme="amber" aria-label="Amber LCD"></button>
        <button class="swatch swatch-blue" data-theme="blue" aria-label="Blue LCD"></button>
      </div>
      <div class="util-icons">
        <button class="icon-btn" id="soundToggle" aria-label="Toggle click sound">🔊</button>
        <button class="icon-btn" id="historyToggle" aria-label="Toggle history">🕘</button>
      </div>
    </div>

    <!-- ============ Screen ============ -->
    <div class="screen">
      <div class="screen-top">
        <span id="modeTag">DEG</span>
        <span id="expression"></span>
      </div>
      <div class="result-row">
        <div id="result" class="result">0</div>
        <button class="copy-btn" id="copyBtn" aria-label="Copy result">⧉</button>
      </div>
      <span class="copied-flash" id="copiedFlash">Copied!</span>
    </div>

    <!-- ============ History drawer ============ -->
    <div class="history-drawer" id="historyDrawer">
      <div class="history-head">
        <span>History</span>
        <button id="clearHistory">Clear</button>
      </div>
      <ul id="historyList" class="history-list">
        <li class="history-empty">No calculations yet.</li>
      </ul>
    </div>


    <!-- ============ Mode row ============ -->
    <div class="mode-row">
      <button class="key key-mode" id="degRad">DEG</button>
      <button class="key key-mode" id="memAdd">M+</button>
      <button class="key key-mode" id="memRecall">MR</button>
      <button class="key key-mode" id="memClear">MC</button>
    </div>

    <!-- ============ Button grid ============ -->
    <div class="keys">

      <button class="key key-fn" data-val="sin(">sin</button>
      <button class="key key-fn" data-val="cos(">cos</button>
      <button class="key key-fn" data-val="tan(">tan</button>
      <button class="key key-fn" data-action="clear">C</button>
      <button class="key key-fn" data-action="backspace">⌫</button>

      <button class="key key-fn" data-val="log(">log</button>
      <button class="key key-fn" data-val="ln(">ln</button>
      <button class="key key-fn" data-val="(">(</button>
      <button class="key key-fn" data-val=")">)</button>
      <button class="key key-fn" data-action="percent">%</button>

      <button class="key key-fn" data-val="sqrt(">&radic;</button>
      <button class="key key-num" data-val="7">7</button>
      <button class="key key-num" data-val="8">8</button>
      <button class="key key-num" data-val="9">9</button>
      <button class="key key-op" data-val="/">&divide;</button>

      <button class="key key-fn" data-action="square">x&sup2;</button>
      <button class="key key-num" data-val="4">4</button>
      <button class="key key-num" data-val="5">5</button>
      <button class="key key-num" data-val="6">6</button>
      <button class="key key-op" data-val="*">&times;</button>

      <button class="key key-fn" data-val="^">x^y</button>
      <button class="key key-num" data-val="1">1</button>
      <button class="key key-num" data-val="2">2</button>
      <button class="key key-num" data-val="3">3</button>
      <button class="key key-op" data-val="-">&minus;</button>

      <button class="key key-fn" data-val="pi">&pi;</button>
      <button class="key key-num" data-val="0">0</button>
      <button class="key key-num" data-val=".">.</button>
      <button class="key key-fn" data-val="!">n!</button>
      <button class="key key-op" data-val="+">+</button>

      <button class="key key-fn" data-val="e">e</button>
      <button class="key key-fn" data-action="ans">ANS</button>
      <button class="key key-equals" data-action="equals" id="equalsBtn">=</button>

    </div>
  </div>

  <p class="hint">Tip: your keyboard works too — numbers, + − * / ( ) and Enter.</p>

  <script>
// ============ State ============
let expr = "";
let isDeg = true;
let memory = 0;
let ans = 0;

const expressionEl = document.getElementById("expression");
const resultEl = document.getElementById("result");
const modeTag = document.getElementById("modeTag");
const degRadBtn = document.getElementById("degRad");

// ============ Degree-aware trig helpers (built on Math object) ============
function sinDeg(x) { return Math.sin((x * Math.PI) / 180); }
function cosDeg(x) { return Math.cos((x * Math.PI) / 180); }
function tanDeg(x) { return Math.tan((x * Math.PI) / 180); }

function factorial(n) {
  n = Math.round(n);
  if (n < 0) return NaN;
  let result = 1;
  for (let i = 2; i <= n; i++) result *= i;
  return result;
}

// ============ Display helpers ============
function prettify(str) {
  return str
    .replaceAll("*", "×")
    .replaceAll("/", "÷")
    .replaceAll("sqrt(", "√(")
    .replaceAll("pi", "π");
}

function render() {
  expressionEl.textContent = prettify(expr);
}

function showResult(val) {
  resultEl.textContent = val;
}

// ============ Convert user-facing expression into a real JS expression ============
function toEvalString(str) {
  let out = str;

  out = out.replaceAll("sqrt(", "Math.sqrt(");
  out = out.replaceAll("log(", "Math.log10(");
  out = out.replaceAll("ln(", "Math.log(");

  if (isDeg) {
    out = out.replaceAll("sin(", "sinDeg(");
    out = out.replaceAll("cos(", "cosDeg(");
    out = out.replaceAll("tan(", "tanDeg(");
  } else {
    out = out.replaceAll("sin(", "Math.sin(");
    out = out.replaceAll("cos(", "Math.cos(");
    out = out.replaceAll("tan(", "Math.tan(");
  }

  out = out.replaceAll("pi", "Math.PI");
  out = out.replace(/(?<![a-zA-Z])e(?![a-zA-Z])/g, "Math.E");
  out = out.replaceAll("^", "**");

  // Postfix factorial: 5! -> factorial(5)
  out = out.replace(/(\d+(\.\d+)?)!/g, "factorial($1)");
  // Postfix percent: 20% -> (20/100)
  out = out.replace(/(\d+(\.\d+)?)%/g, "($1/100)");

  return out;
}

// ============ Core actions ============
function appendToken(tok) {
  expr += tok;
  render();
}

function clearAll() {
  expr = "";
  render();
  showResult("0");
}

function backspace() {
  expr = expr.slice(0, -1);
  render();
}

function calculate() {
  if (!expr) return;

  try {
    const evalStr = toEvalString(expr);
    // Controlled, sandboxed evaluation of a math-only expression built entirely
    // from our own button tokens (no external/user-typed strings reach this).
    const value = Function(
      "sinDeg", "cosDeg", "tanDeg", "factorial",
      `"use strict"; return (${evalStr});`
    )(sinDeg, cosDeg, tanDeg, factorial);

    if (typeof value !== "number" || !isFinite(value)) {
      throw new Error("Invalid result");
    }

    const rounded = Math.round(value * 1e10) / 1e10;
    ans = rounded;
    showResult(rounded);
    history.push({ expr: expr, result: rounded });
    if (typeof renderHistory === "function") renderHistory();
    expr = String(rounded);
    render();
  } catch (err) {
    showResult("Error");
  }
}

// ============ Button wiring ============
document.querySelectorAll(".key").forEach((btn) => {
  btn.addEventListener("click", () => {
    const val = btn.dataset.val;
    const action = btn.dataset.action;

    if (val !== undefined) {
      appendToken(val);
      return;
    }

    switch (action) {
      case "clear":
        clearAll();
        break;
      case "backspace":
        backspace();
        break;
      case "equals":
        calculate();
        break;
      case "square":
        appendToken("^2");
        break;
      case "percent":
        appendToken("%");
        break;
      case "ans":
        appendToken(String(ans));
        break;
    }
  });
});

// ============ Degree / Radian toggle ============
degRadBtn.addEventListener("click", () => {
  isDeg = !isDeg;
  const label = isDeg ? "DEG" : "RAD";
  degRadBtn.textContent = label;
  modeTag.textContent = label;
  degRadBtn.classList.toggle("active", !isDeg);
});

// ============ Memory functions ============
document.getElementById("memAdd").addEventListener("click", () => {
  const current = parseFloat(resultEl.textContent);
  if (!isNaN(current)) memory += current;
});

document.getElementById("memRecall").addEventListener("click", () => {
  appendToken(String(memory));
});

document.getElementById("memClear").addEventListener("click", () => {
  memory = 0;
});

// ============ Keyboard support ============
document.addEventListener("keydown", (e) => {
  const allowedChars = "0123456789.+-*/()";

  if (allowedChars.includes(e.key)) {
    appendToken(e.key);
  } else if (e.key === "Enter" || e.key === "=") {
    e.preventDefault();
    calculate();
  } else if (e.key === "Backspace") {
    backspace();
  } else if (e.key === "Escape") {
    clearAll();
  }
});

// ============ New state for innovations ============
let soundOn = true;
let history = [];

const calcBody = document.getElementById("calcBody");
const soundToggle = document.getElementById("soundToggle");
const historyToggle = document.getElementById("historyToggle");
const historyDrawer = document.getElementById("historyDrawer");
const historyList = document.getElementById("historyList");
const clearHistoryBtn = document.getElementById("clearHistory");
const copyBtn = document.getElementById("copyBtn");
const copiedFlash = document.getElementById("copiedFlash");

// ============ Click sound (Web Audio API beep) ============
let audioCtx = null;

function playBeep() {
  if (!soundOn) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = 640;
  gain.gain.value = 0.06;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
  osc.stop(audioCtx.currentTime + 0.09);
}

soundToggle.addEventListener("click", () => {
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? "🔊" : "🔇";
  soundToggle.classList.toggle("muted", !soundOn);
});

// Beep on every key press
document.querySelectorAll(".key, .icon-btn, .swatch").forEach((el) => {
  el.addEventListener("click", playBeep);
});

// ============ LCD theme switcher ============
document.querySelectorAll(".swatch").forEach((sw) => {
  sw.addEventListener("click", () => {
    document.querySelectorAll(".swatch").forEach((s) => s.classList.remove("active"));
    sw.classList.add("active");

    calcBody.classList.remove("theme-amber", "theme-blue");
    const theme = sw.dataset.theme;
    if (theme === "amber") calcBody.classList.add("theme-amber");
    if (theme === "blue") calcBody.classList.add("theme-blue");
  });
});

// ============ History drawer ============
historyToggle.addEventListener("click", () => {
  historyDrawer.classList.toggle("open");
});

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<li class="history-empty">No calculations yet.</li>';
    return;
  }

  historyList.innerHTML = history
    .slice()
    .reverse()
    .map(
      (h, i) => `
        <li data-index="${history.length - 1 - i}">
          <span class="h-expr">${prettify(h.expr)}</span>
          <span class="h-result">= ${h.result}</span>
        </li>`
    )
    .join("");

  document.querySelectorAll(".history-list li[data-index]").forEach((li) => {
    li.addEventListener("click", () => {
      const idx = Number(li.dataset.index);
      expr = String(history[idx].result);
      render();
      historyDrawer.classList.remove("open");
    });
  });
}

clearHistoryBtn.addEventListener("click", () => {
  history = [];
  renderHistory();
});

// ============ Copy result ============
copyBtn.addEventListener("click", () => {
  const text = resultEl.textContent;
  navigator.clipboard.writeText(text).then(() => {
    copiedFlash.classList.add("show");
    setTimeout(() => copiedFlash.classList.remove("show"), 1000);
  });
});

// ============ Initial paint ============
clearAll();
renderHistory();

</script>
</body>
</html>
